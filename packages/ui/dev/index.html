<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch UI fixture · Fender Offenders</title><style>html,body{height:100%;margin:0;background:radial-gradient(ellipse at 45% 45%,#638171,#183e3a);overflow:hidden}#ui{position:absolute;inset:0}</style></head><body><div id="ui"></div><script type="module">
import { mountGameUi } from '../src/index.ts';
import { createInputSource } from '../../input/src/index.ts';
const snapshot = { protocolVersion:1,mapRevision:'fixture',gameplayRevision:'fixture',sessionEpoch:'fixture',serverTick:0,matchId:'fixture',phase:'playing',phaseEndsAtTick:18000,vehicles:[],projectiles:[],scores:[{playerId:'you',nickname:'Officer Rookie',score:3,wrecks:1,connection:'connected'},{playerId:'rival',nickname:'Parking Menace',score:2,wrecks:2,connection:'connected'}],local:null };
let input;
const fixtureUrl=new URL(location.href);if(!fixtureUrl.searchParams.has('room')){fixtureUrl.searchParams.set('room','FixtureRoom1');history.replaceState(null,'',fixtureUrl);}
const ui = mountGameUi(document.querySelector('#ui'), {
  onPlay(request){window.lastPlay=request;snapshot.scores.find(score=>score.playerId==='you').nickname=request.nickname;ui.update({snapshot,localPlayerId:'you',mode:'online',roomId:request.roomId,status:{state:'playing'}});},
  onActivity(){window.fixtureActivities=(window.fixtureActivities??0)+1;},
  onMenuVisibility(visible){input?.setEnabled(!visible);},
  onSettings(settings){input?.setSettings(settings);},
  onRematch(){ui.update({snapshot:{...snapshot,phase:'countdown',phaseEndsAtTick:180}});},
  onLeave(){},
});
input = createInputSource({onMenuAction:action=>ui.navigate(action)});
input.setEnabled(!ui.isMenuVisible());
window.fixture={ui,input,snapshot};
function frame(){input.pollMenus();if(!ui.isMenuVisible())input.sample();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
