name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm assets:check
      - run: pnpm build
      - name: Verify runner-provided Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - run: pnpm test:e2e
      - name: Verify pursuit guidance and result UI
        run: node packages/ui/dev/pursuit-smoke.mjs
      - name: Verify campaign briefing, tracker and story UI
        run: node packages/ui/dev/campaign-smoke.mjs
      - name: Verify generated callsigns and saved identity
        run: node packages/ui/dev/callsigns-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  container:
    name: Production container
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the exact deployable image
        run: docker build --load -f infra/Dockerfile -t fender-offenders:ci .
      - name: Start the production image
        run: docker run -d --name fender-ci -p 2567:2567 -e ALLOWED_ORIGINS=http://127.0.0.1:2567 fender-offenders:ci
      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2567/ready; then exit 0; fi
            sleep 2
          done
          docker logs fender-ci
          exit 1
      - name: Verify production HTML and multiplayer WebSockets
        run: pnpm test:deploy
      - name: Container logs
        if: always()
        run: docker logs fender-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f fender-ci || true
